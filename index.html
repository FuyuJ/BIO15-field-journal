    reflection: [
      { type:"text", text:"Today we visited the redwoods at Butano State Park, and we had been looking forward to this trip for a while, since we are huge fans of these prehistoric giants that are so iconic to the California coast. Part of the appeal for us is the feeling of being so small in a forest of giants, wrapped in the cool, hushed, almost reverent quiet beneath their shadowy canopy. We started at the visitor center, climbed the Six Bridges Trail, took the Mill Ox Trail up to the Jackson Flats Trail, walked a short spur out and back on the Butano Fire Road, and then looped back on the South Butano Fire Road. Over those few miles the forest changed character several times, and one thread tied much of it together: the different ways these conifers, the redwoods, the Douglas-firs, and later the knobcone pines, have each learned to live with fire." },
      { type:"image", src:"images/butano19.jpg", caption:"Trail map at the Butano visitor center, where the loop began." },
      { type:"text", text:"The first stretch along the Six Bridges Trail was riparian, the streamside habitat that stays reliably wet. It was shaded by alders and bigleaf maples, the kind of trees that crowd close to fresh water, and the nearby willows were easy to pick out by their long, narrow leaves only about an inch wide. The ground was soft with wispy lady ferns (<em>Athyrium filix-femina</em>), which are very common in these moist areas, and the understory was thick with thimbleberry and its big, soft, maple-shaped leaves and white flowers, along with elderberry and huckleberry. Not everything belonged here, though. Climbing one of the trunks was English ivy (<em>Hedera helix</em>), a non-native invasive that smothers native plants and really ought to be removed." },
      { type:"image", src:"images/butano1.jpg", caption:"Thimbleberry and tangled greenery in the streamside thicket." },
      { type:"image", src:"images/butano2.jpg", caption:"A dense riparian thicket lining the Six Bridges Trail." },
      { type:"image", src:"images/butano3.jpg", caption:"A broad-leaved streamside shrub draped with moss and lichen." },
      { type:"image", src:"images/butano4.jpg", caption:"Forget-me-nots blooming in the damp riparian understory." },
      { type:"image", src:"images/butano5.jpg", caption:"A mushroom pushing up through the leaf litter." },
      { type:"image", src:"images/butano6.jpg", caption:"Close up of a soft, deeply veined leaf." },
      { type:"image", src:"images/butano7.jpg", caption:"A wild bramble (<em>Rubus</em>) in white flower." },
      { type:"image", src:"images/butano8.jpg", caption:"Cow parsnip (<em>Heracleum</em>), holding up a broad white umbel." },
      { type:"image", src:"images/butano15.jpg", caption:"Red elderberry (<em>Sambucus racemosa</em>) with its berry clusters." },
      { type:"image", src:"images/butano16.jpg", caption:"Problematic English ivy (<em>Hedera helix</em>) smothering native ferns, the kind of invasive that should be removed." },
      { type:"image", src:"images/butano39.jpg", caption:"A cute stone pathway through the riparian stretch." },
      { type:"image", src:"images/butano17.jpg", caption:"An interesting find on the bridge railing: a cushion of moss colonizing the bare wood." },
      { type:"text", text:"We saw more banana slugs (<em>Ariolimax</em>), the big yellow decomposers of the redwood floor, gliding over the damp leaf litter; they are the second-largest slugs in the world and can stretch to nearly ten inches (about 25 centimetres). Another streamside plant we kept noticing was skinny green whorls of stems standing up like little bottlebrushes, called horsetail (<em>Equisetum</em>). Horsetails are relatives of the ferns, but instead of broad leaves their foliage is reduced to tiny scales, so they do most of their photosynthesis in their green stems, and they are another good indicator of fresh water. Their cell walls are stiffened with silica, which gives them a gritty, scratchy texture, and camping lore says you can scrub a dirty pot, or even your pants, with a handful of them. The ones we see today reach only about knee height, but in prehistoric times their relatives grew into trees up to thirty feet (about ten metres) tall." },
      { type:"image", src:"images/butano18.jpg", caption:"More banana slugs (<em>Ariolimax</em>) gliding over the damp floor.", scale:"Up to ~25 cm (10 in)" },
      { type:"image", src:"images/butano9.jpg", caption:"Horsetail and ferns crowding a moist streamside slope." },
      { type:"image", src:"images/butano11.jpg", caption:"Close up of horsetail (<em>Equisetum</em>), its leaves reduced to tiny scales." },
      { type:"image", src:"images/butano22.jpg", caption:"A bright stand of horsetail, a good indicator of fresh water.", scale:"Stems ~knee height" },
      { type:"text", text:"We also noticed moss growing all over the tree trunks, a nice example of commensalism: the moss gets a place to perch and photosynthesize without taking anything from, or harming, the tree. This part of the forest catches a lot of incoming fog, which the mosses soak up. Mosses are kind of amazing, since they can dry out completely and look dead, then simply rehydrate and carry on once the water returns." },
      { type:"image", src:"images/butano10.jpg", caption:"Moss growing on a trunk, a commensal that photosynthesizes without harming the tree." },
      { type:"text", text:"As the trail climbed onto the Mill Ox and Jackson Flats trails, the riparian strip gave way to redwood and Douglas-fir forest." },
      { type:"image", src:"images/butano12.jpg", caption:"Making our way through the redwoods on the Mill Ox and Jackson Flats trails." },
      { type:"text", text:"Almost right away we found two salamanders tucked into the damp. The larger one was an Ensatina (<em>Ensatina eschscholtzii</em>), maybe five inches (12 centimetres) long, and the skinny, coiled one was a California slender salamander (<em>Batrachoseps attenuatus</em>), barely thicker than a pencil lead and only a few inches long. Both are lungless salamanders that breathe through their moist skin, which is exactly why they stay in this cool, shaded, damp habitat." },
      { type:"image", src:"images/butano20.jpg", caption:"An Ensatina (<em>Ensatina eschscholtzii</em>), the larger of the two salamanders.", scale:"~12 cm (5 in)" },
      { type:"image", src:"images/butano21.jpg", caption:"A California slender salamander (<em>Batrachoseps attenuatus</em>), coiled on the ground.", scale:"Pencil-thin, a few inches long" },
      { type:"text", text:"And then there were the redwoods themselves. Coast redwoods (<em>Sequoia sempervirens</em>) are the tallest trees on Earth; the current record holder, a tree named Hyperion up in Humboldt County, stands about 380 feet, or 116 metres, tall, well above the height of a 30-storey building, and the species regularly tops 300 feet (90 metres) and lives more than a thousand years. For such giants, they make astonishingly tiny cones, only about an inch (2 to 3 centimetres) long. Sadly, only about five percent of California's original old-growth redwood survives, with the rest having been logged, and part of what made the wood so prized is that redwood is full of tannins and other compounds that make it naturally resistant to rot, insects, and fire. That same chemistry, together with thick, fibrous bark that can be close to a foot (30 centimetres) deep, is also what helps a redwood survive a burn. We could tell the redwoods from the Douglas-firs up close: redwoods have flat, needle-like leaves arranged in sprays, reddish bark, and long vertical furrows running up the trunk." },
      { type:"image", src:"images/butano13.jpg", caption:"Looking up the trunk of a coast redwood (<em>Sequoia sempervirens</em>).", scale:"Coast redwoods regularly top 90 m (300 ft)" },
      { type:"image", src:"images/butano23.jpg", caption:"In among the redwoods and the creek." },
      { type:"text", text:"Growing right among the redwoods were Douglas-firs (<em>Pseudotsuga menziesii</em>), which can be nearly as tall; they are in fact the second-tallest conifer on Earth, reaching around 100 metres, or 330 feet. The easiest way to tell the two apart is by their leaves and cones. Douglas-fir needles are softer and brushier, standing out around the twig rather than lying flat, and the cones, about three to four inches (8 to 10 centimetres) long, are unmistakable: each one has little three-pronged bracts sticking out between the scales, like rows of tiny tridents or mouse feet. The redwood cone, by contrast, is barely the size of an olive. This contrast is part of what we find so fascinating about the forest, the way two enormous conifers can share the same ground while doing almost everything differently." },
      { type:"image", src:"images/butano34.jpg", caption:"Douglas-fir pinecone, with the three-pronged trident bracts sticking out between the scales.", scale:"~8–10 cm (3–4 in)" },
      { type:"image", src:"images/butano50.jpg", caption:"Douglas-fir foliage and cones up in the canopy." },
      { type:"image", src:"images/butano51.jpg", caption:"Close up of Douglas-fir leaves, soft and brushy rather than flat." },
      { type:"text", text:"The redwood understory had its own signature plants. Spreading across the shaded floor was redwood sorrel (<em>Oxalis oregana</em>), which looks like a patch of oversized three-leaf clovers, each leaflet an inch or two (2 to 4 centimetres) across, with whitish-pink flowers. It is beautifully adapted to deep shade, photosynthesizing at as little as one two-hundredth of full sunlight, and it holds its leaves out broad and flat to capture every scrap of light. But that same shade-loving machinery is easily damaged, so when a bright patch of sun lands on it, the plant folds its leaves straight down like little umbrellas within minutes to protect itself, then reopens them once the shade returns. It is a close relative of the weedy yellow-flowered Bermuda buttercup (<em>Oxalis pes-caprae</em>) that is so invasive around the Bay Area, but this one truly belongs here." },
      { type:"image", src:"images/butano28.jpg", caption:"A carpet of redwood sorrel (<em>Oxalis oregana</em>) on the shaded forest floor.", scale:"Leaflets ~2–4 cm across" },
      { type:"image", src:"images/butano29.jpg", caption:"Redwood sorrel in sunlight, folding its leaves down to protect itself." },
      { type:"text", text:"Other classic redwood plants were everywhere. There was western sword fern (<em>Polystichum munitum</em>), whose fronds can be over five feet (1.5 metres) long, supposedly named because each leaflet looks a little like a sword tucked into a sheath, along with evergreen huckleberry. Draping the branches was beard lichen (<em>Usnea</em>), the stringy, pale-green strands that are not a single organism at all but a partnership between a fungus and an alga." },
      { type:"image", src:"images/butano25.jpg", caption:"Western sword fern (<em>Polystichum munitum</em>), a classic redwood-forest fern.", scale:"Fronds to ~1.5 m (5+ ft)" },
      { type:"image", src:"images/butano26.jpg", caption:"Holding up a single sword-shaped leaflet, the shape that names the sword fern." },
      { type:"image", src:"images/butano27.jpg", caption:"Pausing to look at a huckleberry plant." },
      { type:"image", src:"images/butano33.jpg", caption:"Beard lichen (<em>Usnea</em>), a partnership between a fungus and an alga." },
      { type:"image", src:"images/butano41.jpg", caption:"A Pacific Coast iris, most likely Douglas iris (<em>Iris douglasiana</em>), white with fine purple veins. ID tentative." },
      { type:"text", text:"Fungi were doing the crucial work of decomposition, since they are among the few organisms that can break down wood. The little colorful shelves fanning off the logs were turkey tail and related shelf fungi, and the harder, hoof-like brackets on the trunks were <em>Fomitopsis</em> conks, sometimes called red belt fungus. They reproduce by dropping spores out of the tiny pores on their undersides." },
      { type:"image", src:"images/butano14.jpg", caption:"Turkey tail and other shelf fungi decomposing a fallen tree." },
      { type:"image", src:"images/butano32.jpg", caption:"A shelf mushroom bracketing out from a standing trunk." },
      { type:"image", src:"images/butano37.jpg", caption:"Red belt fungus (<em>Fomitopsis</em>) close up on a fire-damaged trunk." },
      { type:"image", src:"images/butano40.jpg", caption:"An interesting black fungus dotting a lichen-covered log." },
      { type:"text", text:"Redwoods have a surprising trick when it comes to reproduction. Their cones and seeds are tiny, and rather than relying mainly on seed, redwoods reproduce a great deal by cloning themselves, sprouting new shoots from their base or their roots. That is why you so often see a ring of redwoods encircling an old stump, every one of them a genetically identical clone of the original tree. These are sometimes called fairy rings, formed when the parent is damaged by fire or felling and a circle of sprouts rises up around it. The living tissue doing all that growing, the cambium, is the thin layer just beneath the protective bark. Redwoods also do something even stranger: they send branches upward to become entire new trunks, building aerial habitats high in the canopy, complete with pockets of soil and their own little communities of creatures living out their whole lives far above the ground." },
      { type:"image", src:"images/butano36.jpg", caption:"A redwood sending a limb upward as a new trunk, an example of reiteration." },
      { type:"text", text:"Somewhere in the understory we watched a Pacific wren, a tiny brown bird only about four inches (10 centimetres) long, weighing about as much as two quarters, but with an outsized voice. The males have a charming courtship strategy: a male builds several nests around his territory, then leads a visiting female on a tour of them, and if she is satisfied she chooses one and finishes its lining herself." },
      { type:"image", src:"images/butano30.jpg", caption:"A Pacific wren (photo credit to Zach).", scale:"~10 cm (4 in)" },
      { type:"image", src:"images/butano31.jpg", caption:"A Pacific wren perched in the mossy understory." },
      { type:"text", text:"Higher up, the forest carried deep scars from fire. In August 2020 the CZU Lightning Complex Fire, set off by a storm that threw nearly eleven thousand dry lightning strikes across the region, burned more than eighty-six thousand acres across San Mateo and Santa Cruz counties, including much of Butano. (CZU is simply CalFire's name for its combined San Mateo, Santa Cruz, and San Francisco unit.) Some redwoods had been hollowed out at the base into blackened chambers called goose pens, yet were still very much alive and resprouting, a testament to how well redwoods are built to survive fire: their thick, fibrous, tannin-rich bark insulates the living tissue, and unlike many conifers they carry very little flammable resin. State Parks staff have even described the Butano burn as, on balance, beneficial for the forest. All around the burned areas the ground was busy with new growth." },
      { type:"image", src:"images/butano24.jpg", caption:"Fire damage, blackened trunks standing among the redwoods." },
      { type:"image", src:"images/butano35.jpg", caption:"A redwood hollowed at the base by past fire, a goose pen, yet still alive and growing." },
      { type:"image", src:"images/butano42.jpg", caption:"A hole left behind by burnt roots, with the charred trunk leaning beside it." },
      { type:"image", src:"images/butano38.jpg", caption:"Fire-charred trees." },
      { type:"image", src:"images/butano43.jpg", caption:"More evidence of fire: standing dead trunks with green pushing up below." },
      { type:"text", text:"Out on the Butano Fire Road spur the trail climbed to a high point on a different kind of ground: pale, sandy soil weathering out of the Santa Margarita Sandstone. This rock began as sediment on an ancient seafloor, roughly seven to ten million years ago, and over those millions of years tectonic uplift pushed the old marine layers up above sea level into these hills, so it is genuinely possible to find traces of long-gone sea creatures in the stone." },
      { type:"image", src:"images/butano44.jpg", caption:"Reaching the high point on the bare sandstone ridge." },
      { type:"image", src:"images/butano48.jpg", caption:"Another view of the fire damage and regrowth from the peak." },
      { type:"image", src:"images/butano53.jpg", caption:"Blocks of Santa Margarita Sandstone, ancient seafloor lifted up into these hills with ancient evidence of life." }, 
      { type:"text", text:"This poor, sandy sandstone soil supports plants that struggle elsewhere, and toward the end of the spur it gave way to a closed-cone pine forest of knobcone pine (<em>Pinus attenuata</em>), a tree that depends on fire to reproduce. Its cones are serotinous, meaning they stay sealed shut with a hard resin, clustered in knobby whorls right around the branches, sometimes for so long that the wood grows over them. They will not open until the heat of a fire, around four hundred degrees Fahrenheit (200 degrees Celsius), melts the resin and frees the seeds onto freshly cleared, sunlit ground. The fire usually kills the parent trees, which are mostly small, often under thirty feet (ten metres), but the next generation springs up all at once, which is why knobcone pines tend to grow in even-aged stands dating to the last burn. It is the complete opposite of the redwood's approach: where the redwood survives the fire and resprouts, the knobcone pine sacrifices itself and banks its seeds for exactly that moment." },
      { type:"image", src:"images/butano54.jpg", caption:"A knobcone pine (<em>Pinus attenuata</em>) on a sandstone outcrop, a tree that depends on fire.", scale:"Often under ~10 m (30 ft)" },
      { type:"image", src:"images/butano46.jpg", caption:"Knobcone cones still clustered along a fire-blackened branch." },
      { type:"image", src:"images/butano47.jpg", caption:"Close up of a knobcone pinecone, sealed with resin until fire opens it." },
      { type:"text", text:"The burned, opened ground was full of fire-followers making the most of the new sunlight and space. Bright yellow flowers covered a low shrub that looked like bush poppy (<em>Dendromecon rigida</em>), one of the classic plants that flush after a California fire. Along a sunnier edge we spotted a lovely Pacific Coast iris, most likely a Douglas iris (<em>Iris douglasiana</em>), white with fine purple veins. The drier, more exposed slopes shaded into chaparral and, in places, oak woodland." },
      { type:"image", src:"images/butano45.jpg", caption:"Lots of these fire-followers after the burn, most likely bush poppy (<em>Dendromecon rigida</em>)." },
      { type:"image", src:"images/butano49.jpg", caption:"More new growth filling in the burned, opened ground." },
      { type:"text", text:"We walked back down the South Butano Fire Road past slopes of new growth, much of it the same height, all of it racing to claim the open sun and space the fire created. Most of those seedlings will not survive the competition. We finished the day by spotting a pair of mating insects on the trail." },
      { type:"image", src:"images/butano52.jpg", caption:"On the walk back down, new growth all coming up at about the same height." },
      { type:"image", src:"images/butano55.jpg", caption:"A pink-flowered hedge nettle (<em>Stachys</em>) near the end of the trail hosting a pair of mating insects." }
    ]
  },

    habitat: "Estuary, salt marsh, managed salt pond, sloughs, and mudflats at the south end of San Francisco Bay (Santa Clara County), on the Pacific Flyway.",
    description: [],

    reflection: [
      { type:"text", text:"Today we visited Don Edwards San Francisco Bay National Wildlife Refuge, starting at the Environmental Education Center in Alviso, where we had the pleasure of being guided by two members of the San Francisco Bay Wildlife Society. Before heading out, we learned a bit about what a wildlife refuge actually is. At a refuge, research staff such as biologists monitor species and manage habitat, which includes endangered-species and bird surveys, bird banding, and educational programs. The difference between a refuge and a national park is that a refuge puts wildlife first rather than human recreation, and the access and the events here are free and easy to get to. There are more than 560 national wildlife refuges across the United States, and while many are open to the public, some are kept closed because they cannot absorb any human impact at all. Don Edwards is one of the open ones, along with San Pablo Bay and Salinas River in this part of the bay." },
      { type:"image", src:"images/don24.jpg", caption:"One of our San Francisco Bay Wildlife Society guides introducing the refuge and the wider bay refuge complex." },
      { type:"text", text:"Don Edwards is a huge stop for birds. It sits on the Pacific Flyway, the major migration route that runs north to south all the way from Alaska to South America, and more than 280 species of birds pass through every year, which makes it an important breeding site and stopover. The refuge covers about 30,000 acres, stretching up toward Redwood City and around to Alviso, and at its heart it is a saltwater marsh whose dominant plant is pickleweed. It was established in 1972, largely thanks to local activism, and was later renamed in 1995 to honor Congressman Don Edwards, who pushed the bill that protected it. Before that, the area was poorly cared for and often used as a dumping site, and because this is tidal habitat, that trash kept getting pulled back out into the bay." },
      { type:"text", text:"This whole system is an estuary, a body of water along the coastline where freshwater from streams and rivers mixes with saltwater from the ocean, and like any ecosystem it is built in trophic levels. At the first level, the producers, are organisms that capture energy through photosynthesis, such as algae and phytoplankton. At the second level are the primary consumers, herbivores like snails and zooplankton that get their energy by eating producers. At the third level are the secondary consumers, the carnivores and omnivores such as crabs and shorebirds that get their energy by eating the primary consumers. All of this runs on the tides, and here in the bay there are two high tides and two low tides every day." },
      { type:"text", text:"Right at the Education Center we noticed cliff swallows building their mud nests in between the beams of the building, tucked up under the eaves." },
      { type:"image", src:"images/don25.jpg", caption:"Cliff swallows building their nests in between the beams of the building." },
      { type:"text", text:"Out in the marsh, the first plant our guides pointed out was alkali heath, an important flowering plant for pollinators like butterflies. It deals with the salty environment by sweating its salt out: it has purple flowers and a sage-ish color and shoots straight up, and if you rub your fingers along it you will most likely feel the salt crystals it has pushed out. In the sunlight it becomes really pretty as it glistens from all those crystals." },
      { type:"image", src:"images/don26.jpg", caption:"Alkali heath, a salt-sweating plant with purple flowers and a sage-gray color." },
      { type:"text", text:"Pickleweed handles its salt differently. Instead of sweating it out, it pushes all of its salt up toward the very tips of the plant as it grows, and that section starts to discolor and turn a bright red. Eventually that piece dies and falls off, and the pickleweed simply keeps growing. Pickleweed is actually edible, and is sometimes used in restaurants as a garnish; even in its green stage it is very salty and slightly crunchy." },
      { type:"image", src:"images/don27.jpg", caption:"Fresh bright green pickleweed for us to taste." },
      { type:"image", src:"images/don28.jpg", caption:"Pickleweed up close, salty and slightly crunchy even in its green stage." },
      { type:"image", src:"images/don29.jpg", caption:"Pickleweed in its redder state, where salt pushed to the tips discolors it before that piece drops off." },
      { type:"text", text:"Out on the mud we watched black-necked stilts, elegant black-and-white shorebirds about 35 to 40 centimeters tall on long, thin pink legs, walking around and digging for food in the salt marsh mud, mostly invertebrates and insects. Their chicks are remarkably independent: they hatch and largely raise themselves, learning by watching their parents from a distance rather than through much direct care. As a result we saw quite a few fluffy babies just walking around on their own." },
      { type:"image", src:"images/don30.jpg", caption:"An interpretive sign about the black-necked stilts." },
      { type:"image", src:"images/don1.jpg", caption:"A baby black-necked stilt feeding on its own in the shallows." },
      { type:"image", src:"images/don2.jpg", caption:"An adult black-necked stilt among the pickleweed.", scale:"~35–40 cm tall" },
      { type:"image", src:"images/don4.jpg", caption:"A young stilt picking its way through the water by itself." },
      { type:"image", src:"images/don5.jpg", caption:"An adult black-necked stilt wading and reflected in the still water." },
      { type:"text", text:"I did not manage to photograph one myself, but the guides told us about the California Ridgway's rail, an endangered marsh bird (Cali for short) that comes out at low tide to feed on insects and invertebrates. It can drink saltwater because it has ways of processing the extra salt, so it never needs to leave the marsh to find fresh water." },
      { type:"image", src:"images/don31.jpg", caption:"Our guide holding up a photo of the California Ridgway's rail, which we did not manage to photograph ourselves." },
      { type:"text", text:"Another creature found only here is the salt marsh harvest mouse, which is endemic to these bay marshes and about the size of your thumb, so really tiny, weighing less than an eighth of an ounce. It is the only mammal in the world that lives exclusively in coastal marshes, and it relies specifically on pickleweed for its home and as one of its main food sources, eating it all day. It has some neat adaptations: it is mainly nocturnal, so it has big eyes for seeing in the dark, and it is a strong swimmer, so when a high tide floods the pickleweed it can simply swim to higher ground. Like the rail, it can also drink saltwater, thanks to specialized kidneys." },
      { type:"image", src:"images/don32.jpg", caption:"An interpretive sign, A Mouse's Tale, about the endangered salt marsh harvest mouse." },
      { type:"text", text:"Sadly, around 85 percent of the bay's salt marshes have been destroyed, which is detrimental for a lot of reasons. One is climate: this habitat acts like a sponge for the bay, soaking up the extra water that comes with sea level rise, increased flooding, and stronger storms. To build resilience, the South San Francisco Bay Shoreline Project is raising levees all along the south bay, up to about 12 to 15 feet, since some parts of Alviso actually sit below sea level, and the levees also help protect the wastewater treatment plants. The levee here is part of that project, which has finished its first phase, with more levees planned in other areas." },
      { type:"image", src:"images/don3.jpg", caption:"The boardwalk and the raised levee behind it, part of the South Bay shoreline project.", scale:"Levees raised to ~12–15 ft" },
      { type:"text", text:"From there we looked at a managed salt pond, Pond 816, which looks completely different from the salt marsh on the other side. Out on it were families of Canada geese and ducks with their ducklings. For comparison, the salt marsh beside it was a low green and red carpet threaded with winding tidal channels." },
      { type:"image", src:"images/don33.jpg", caption:"A managed salt pond, Pond 816, with its long levee islands, looking very different from the marsh." },
      { type:"image", src:"images/don34.jpg", caption:"Salt marsh threaded with tidal channels, shown for comparison with the salt pond." },
      { type:"text", text:"A lot of those marshes were lost to the salt industry, which was historically huge in the bay and still operates on a smaller scale, now concentrated around Newark, where you can see a big white mound of salt way off on the horizon. To make salt, a company builds a levee all the way around a marsh, cutting off the tidal flow, which changes the entire species profile and kills off the vegetation, leaving a pond where the water evaporates so the salt can be collected. It is not sustainable, especially with climate change, so since 2003 there has been a large effort called the South Bay Salt Pond Restoration Project, the largest tidal wetland restoration on the West Coast, which aims to restore about 15,100 acres. The basic idea is to punch holes in the levees to let the tides back in, and over time the area re-vegetates and brings back all the benefits of a salt marsh. Not every pond is being converted, though, since some species depend on the salt ponds, which are productive in their own way." },
      { type:"text", text:"When the tide is in, the sloughs become highways. Harbor seals use them to move around, and leopard sharks rely on them too, especially as nurseries. Leopard sharks give birth to live pups rather than laying eggs, and the young can apparently be found around the piers in Fremont, gradually making their way out to the ocean as they grow into adults of over five feet." },
      { type:"image", src:"images/don35.jpg", caption:"A slough, used by harbor seals as a highway and by leopard sharks as a nursery." },
      { type:"image", src:"images/don36.jpg", caption:"Our guide showing us a photo of a leopard shark.", scale:"Adults over ~1.5 m (5 ft)" },
      { type:"text", text:"When a slough drains at low tide, it exposes the fourth main habitat, the mudflats. These act like a buffet for shorebirds, which probe the mud for invertebrates, mollusks, and worms, and low tide is also the most likely time to spot the Ridgway's rail. Much of the wastewater from Santa Clara is treated at the San Jose-Santa Clara facility, a small percentage of which is recycled while most is treated and discharged into the bay and the sloughs." },
      { type:"text", text:"Along the way we noticed plenty of other plants and birds. There was California poppy, the state flower, and the spiny purple milk thistle, a non-native. We watched a pair of ducks, a female and a male, and several Canada geese, some flying low over the water, one heading down to the shore, and a whole family paddling out with their goslings. A Monarch Waystation sign marked a spot planted with milkweed and nectar sources for migrating monarch butterflies. We also saw invasive mustard, which the wind seeds readily along the levees, and a bumblebee working a wild radish flower." },
      { type:"image", src:"images/don38.jpg", caption:"California poppy (<em>Eschscholzia californica</em>), the state flower." },
      { type:"image", src:"images/don9.jpg", caption:"Milk thistle (<em>Silybum marianum</em>), a spiny non-native with purple flower heads." },
      { type:"image", src:"images/don7.jpg", caption:"A pair of ducks, a female and a male, on the salt-crusted shore." },
      { type:"image", src:"images/don11.jpg", caption:"A pair of geese flying low over the water." },
      { type:"image", src:"images/don12.jpg", caption:"A Canada goose making its way down to the water." },
      { type:"image", src:"images/don13.jpg", caption:"A family of Canada geese heading into the water with their goslings." },
      { type:"image", src:"images/don37.jpg", caption:"A Monarch Waystation sign: the refuge plants milkweed and nectar sources for migrating monarchs." },
      { type:"image", src:"images/don38.jpg", caption:"Invasive mustard, which the wind seeds readily along the levees." },
      { type:"image", src:"images/don23.jpg", caption:"A bumblebee working a wild radish flower, one of the pollinators we watched." },
      { type:"text", text:"Then we made our way over to the Charleston Slough and Adobe Creek loop in Mountain View to look at a few more species. Of note was dodder, a native parasitic plant that grows on the pickleweed and looks just like orange silly string, even though it is actually a plant. We passed stands of white-flowered umbellifers, most likely poison hemlock, along the way." },
      { type:"image", src:"images/don14.jpg", caption:"A patch of white-flowered umbellifers, most likely poison hemlock, at the Charleston Slough loop." },
      { type:"image", src:"images/don17.jpg", caption:"Dodder, a native parasitic plant, draped over the pickleweed like orange silly string." },
      { type:"text", text:"We finished the day with more birds: a sparrow perched among the dry fennel, geese flying over in loose formation, a gathering of geese and ducks resting along the creek, tall reeds rustling by the water, a great egret skimming low over the surface, and gulls flying over the marsh." },
      { type:"image", src:"images/don15.jpg", caption:"A sparrow, most likely a song sparrow, perched among the dry fennel." },
      { type:"image", src:"images/don16.jpg", caption:"Geese flying over in v formation." },

      { type:"image", src:"images/don20.jpg", caption:"Tall reeds and grasses along the channel." },
      { type:"image", src:"images/don21.jpg", caption:"A great egret in flight, low over the water." },
      { type:"image", src:"images/don22.jpg", caption:"Gulls in flight over the marsh." }
    ]

    ]
  },
  {
    icon: "otter",

    title: "Elkhorn Slough",

    ],

    habitat: "One of California's largest tidal salt marshes and estuaries — mudflats, marsh, and open water rich in shorebirds, harbor seals, and sea otters; oak woodland and grassland on the uplands.",
    description: [

/* ==========================================================================
   RENDERING  —  you generally don't need to touch anything below here.
   ========================================================================== */

// ---- build a custom map pin from an icon key (SVG teardrop) --------------
function pinSVG(iconKey){
  const color = ICON_COLOR[iconKey] || '#5f6f4a';
  const motif = ICON_PATHS[iconKey] || ICON_PATHS.leaf;
  return `<svg class="pin" width="40" height="54" viewBox="0 0 40 54" xmlns="http://www.w3.org/2000/svg" overflow="visible">
      <path d="M20 52C9 37 3 29 3 19A17 17 0 0 1 37 19c0 10-7 19-17 33z" fill="${color}" stroke="#221f18" stroke-width="1.5"/>
      <circle cx="20" cy="19" r="12" fill="${color}" stroke="#fff" stroke-width="1.4"/>
      <g transform="translate(8,7)">${motif}</g>
    </svg>`;
  /* >>> CUSTOM ART:  to use your own drawing instead of these built-in icons,
     replace the marker below with:
        L.marker([e.lat,e.lng], { icon: L.icon({
            iconUrl:'images/my-pin-coastal.png',
            iconSize:[46,58], iconAnchor:[23,58], popupAnchor:[0,-50]
        })})
     Put the PNG (transparent background works best) in your /images folder. */
}

// ---- init the Leaflet map ------------------------------------------------
const map = L.map('map', { zoomControl:true, scrollWheelZoom:true });
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution:'&copy; OpenStreetMap &copy; CARTO', maxZoom:19, subdomains:'abcd'
}).addTo(map);

const bounds = [];
ENTRIES.forEach((e, i) => {
  const icon = L.divIcon({ html: pinSVG(e.icon), className:'', iconSize:[40,54], iconAnchor:[20,52] });
  const m = L.marker([e.lat, e.lng], { icon }).addTo(map);
  m.bindTooltip(`<b>${e.title}</b><br>${fmtDate(e.date)}`, { direction:'top', offset:[0,-46] });
  m.on('click', () => openEntry(i));
  bounds.push([e.lat, e.lng]);
});
if (bounds.length) map.fitBounds(bounds, { padding:[70,70], maxZoom:11 });
else map.setView([37.3, -122.1], 9);

// ---- build the sidebar index --------------------------------------------
const list = document.getElementById('index-list');
document.getElementById('count').textContent = ENTRIES.length;
ENTRIES.forEach((e, i) => {
  const item = document.createElement('div');
  item.className = 'index-item';
  item.dataset.i = i;
  item.innerHTML = `
    <span class="index-num">${String(i+1).padStart(2,'0')}</span>
    <span class="index-pin">${pinSVG(e.icon).replace('class="pin"','class="pin" style="filter:none;transform:none"')}</span>
    <span class="index-meta">
      <h3>${e.title}</h3>
      <div class="d">${fmtDate(e.date)} · ${shortSite(e.site)}</div>
    </span>`;
  item.onclick = () => openEntry(i);
  list.appendChild(item);
});

// ---- open a journal entry ("the page") -----------------------------------
function openEntry(i){
  const e = ENTRIES[i];
  document.querySelectorAll('.index-item').forEach(el=>el.classList.toggle('active', +el.dataset.i===i));
  document.getElementById('entry-where').textContent = `${e.lat.toFixed(4)}, ${e.lng.toFixed(4)} · ${e.site}`;

  document.getElementById('sheet').innerHTML = `
    <div class="entry-theme">${e.theme}</div>
    <div class="title-row">
      <span class="title-pin">${pinSVG(e.icon)}</span>
      <h1 class="entry-title">${e.title}</h1>
    </div>
    <div class="entry-site">${e.site}</div>

    <div class="data-sheet">
      <div class="row">
        <div class="cell"><span class="lbl">Date</span><span class="val">${fmtDate(e.date)}</span></div>
        <div class="cell"><span class="lbl">Start time</span><span class="val">${e.timeStart}</span></div>
      </div>
      <div class="row">
        <div class="cell wide"><span class="lbl">Location (coordinates)</span>
          <span class="val" style="font-family:var(--font-mono);font-size:14px">${e.lat.toFixed(4)}, ${e.lng.toFixed(4)}</span></div>
      </div>
      <div class="row">
        <div class="cell"><span class="lbl">Temperature</span><span class="val">${e.weather.temp}</span></div>
        <div class="cell"><span class="lbl">Cloud cover</span><span class="val">${e.weather.cloud}</span></div>
      </div>
      <div class="row">
        <div class="cell"><span class="lbl">Wind direction</span><span class="val">${e.weather.windDir}</span></div>
        <div class="cell"><span class="lbl">Wind speed</span><span class="val">${e.weather.windSpeed}</span></div>
      </div>
      <div class="row">
        <div class="cell wide"><span class="lbl">Observation times</span>
          <ul class="obs-times">${e.observations.map(o=>`<li><b>${o.time}</b>${o.note}</li>`).join('')}</ul></div>
      </div>
      <div class="row">
        <div class="cell wide"><span class="lbl">Habitat / vegetation type</span><span class="val">${e.habitat}</span></div>
      </div>
    </div>

    ${e.images && e.images.length ? `
    <h2 class="sec">Photographs <span>// field observations</span></h2>
    <div class="plates">
      ${e.images.map(img=>`
        <figure class="plate">
          <div class="frame">${mediaTag(img.src)}</div>
          <figcaption class="cap">${img.caption}${img.src?'':' <span class="placeholder-note">(replace with your photo)</span>'}</figcaption>
          <div class="scale">Scale: ${img.scale}</div>
        </figure>`).join('')}
    </div>` : ''}

    ${e.species && e.species.length ? `
    <h2 class="sec">Identifications <span>// species observed</span></h2>
    <ul class="species">
      ${e.species.map(s=>`<li><span class="sci">${s.sci}</span><span class="com">${s.com}</span><span class="note">${s.note}</span></li>`).join('')}
    </ul>` : ''}

    <h2 class="sec">Field Notes &amp; Reflection <span>// observations &amp; insight</span></h2>
    <div class="essay">
      ${e.description.map(p=>`<p>${p}</p>`).join('')}
      ${renderBlocks(e.reflection)}
    </div>`;

  const entry = document.getElementById('entry');
  entry.classList.add('open');
  entry.scrollTop = 0;
}
function closeEntry(){ document.getElementById('entry').classList.remove('open'); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeEntry(); });

// ---- helpers -------------------------------------------------------------
function fmtDate(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
}
function shortSite(s){ return s.split(',')[0]; }
function photoPlaceholder(){
  return `<svg width="84" height="84" viewBox="0 0 84 84" fill="none" stroke="#b9a679" stroke-width="2.4">
    <rect x="13" y="25" width="58" height="40" rx="4"/>
    <path d="M30 25l5-7h14l5 7" stroke-linejoin="round"/>
    <circle cx="42" cy="45" r="11"/>
    <circle cx="42" cy="45" r="4" fill="#b9a679" stroke="none"/>
    <circle cx="61" cy="34" r="2" fill="#b9a679" stroke="none"/></svg>`;
}
// ---- pick the right element for a media source: photo, local video, or YouTube/Vimeo link
function mediaTag(src){
  if(!src) return photoPlaceholder();
  const yt = src.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
  if(yt) return `<iframe src="https://www.youtube.com/embed/${yt[1]}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
  const vm = src.match(/vimeo\.com\/(\d+)/);
  if(vm) return `<iframe src="https://player.vimeo.com/video/${vm[1]}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
  if(/\.(mp4|mov|m4v|webm|ogg)$/i.test(src)) return `<video src="${src}" controls playsinline preload="metadata"></video>`;
  return `<img src="${src}" alt="">`;
}
// ---- render the reflection essay: text / prompt / image blocks, with photos grouped into a half-width grid
function renderBlocks(blocks){
  const P = { notice:['I notice…','pl-notice'], wonder:['I wonder…','pl-wonder'], reminds:['It reminds me of…','pl-reminds'] };
  const figure = (b, opts)=>{
    opts = opts || {};
    const align = opts.align || b.align || 'full';
    const inner = mediaTag(b.src);
    return `<figure class="inline ${align}">
        <div class="frame">${inner}</div>
        <figcaption class="cap">${b.caption||''}${b.src?'':' <span class="placeholder-note">(replace with your photo or video)</span>'}</figcaption>
        ${b.scale?`<div class="scale">Scale: ${b.scale}</div>`:''}
      </figure>`;
  };
  let html = '', i = 0;
  while(i < blocks.length){
    const b = blocks[i];
    if(b.type==='image' || b.type==='video'){
      const run = [];
      while(i < blocks.length && (blocks[i].type==='image' || blocks[i].type==='video')){ run.push(blocks[i]); i++; }
      if(run.length === 1 && (run[0].align === 'left' || run[0].align === 'right')){
        html += figure(run[0]);                       // explicit float beside text
      } else {
        html += `<div class="photo-grid${run.length===1?' single':''}">${run.map(blk=>figure(blk,{align:'full'})).join('')}</div>`;  // half-width cells; lone photo centered
      }
    } else if(b.type==='prompt'){
      const [phrase,cls] = P[b.kind] || ['',''];
      html += `<p><span class="prompt-lead ${cls}">${phrase}</span> ${b.text}</p>`;
      i++;
    } else {
      html += `<p>${b.text}</p>`;
      i++;
    }
  }
  return html;
}
